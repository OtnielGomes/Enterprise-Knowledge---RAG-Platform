services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pgd
      POSTGRES_PASSWORD: pgd
      POSTGRES_DB: pgd
    volumes:
      - pgd_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgd -d pgd"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pgd:pgd@db:5432/pgd
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      CHAT_MODEL: ${CHAT_MODEL:-gpt-4o-mini}
      CORPUS_CUTOFF: ${CORPUS_CUTOFF:-2026-09-18}
      SNAPSHOT_DIR: /app/snapshot
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build: ./web
    depends_on:
      api:
        condition: service_healthy
    environment:
      ASK_API_URL: http://api:8000
    ports:
      - "3000:3000"

volumes:
  pgd_data:
