[project]
name = "pgd-teletrabalho-ask"
version = "0.1.0"
description = "Ask seam for the Unifesp PGD Teletrabalho assistant"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ask*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
